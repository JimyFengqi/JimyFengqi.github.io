version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    # 一次最多 5 个 PR，避免被大量更新淹没
    open-pull-requests-limit: 5
    # 把次要/补丁更新合并成单个 PR，减少噪音
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # 已手动升级到 Hexo 8。后续 Hexo 大版本(major)升级仍属破坏性变更，
      # 需手动验证(新分支+构建验证后合并)，这里忽略自动 major PR 避免构建被搞坏。
      - dependency-name: "hexo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "hexo-*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"
